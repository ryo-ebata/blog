name: 🐛 Bug Report
description: バグや問題を報告する
title: "[Bug] "
labels: ["🐛 バグ"]
body:
  - type: markdown
    attributes:
      value: |
        バグ報告ありがとうございます！問題を解決するために、以下の情報を提供してください。

  - type: input
    id: title-summary
    attributes:
      label: タイトル（簡潔な要約）
      description: "この内容がIssueのタイトルに使用されます。例: 「ホームページでボタンがクリックできない」"
      placeholder: "例: ホームページでボタンがクリックできない"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: バグの説明
      description: バグの詳細な説明を記入してください
      placeholder: 何が起こったか、何が期待されていたかを説明してください
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
      description: バグを再現するための手順を記入してください
      placeholder: |
        1. '...' に移動
        2. '...' をクリック
        3. '...' までスクロール
        4. エラーを確認
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待される動作
      description: 期待されていた動作を記入してください
      placeholder: 何が起こるべきだったか
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      description: 実際に何が起こったかを記入してください
      placeholder: 実際に何が起こったか
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: スクリーンショット
      description: 可能であれば、問題を説明するスクリーンショットを追加してください
      placeholder: スクリーンショットをここにドラッグ&ドロップ

  - type: dropdown
    id: browsers
    attributes:
      label: ブラウザ
      description: どのブラウザで発生しましたか？
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other
    validations:
      required: false

  - type: input
    id: browser-version
    attributes:
      label: ブラウザバージョン
      description: "ブラウザのバージョンを記入してください（例: Chrome 120.0.0.0）"
      placeholder: "Chrome 120.0.0.0"

  - type: dropdown
    id: os
    attributes:
      label: オペレーティングシステム
      description: どのOSで発生しましたか？
      options:
        - Windows
        - macOS
        - Linux
        - iOS
        - Android
        - Other
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: 環境情報
      description: その他の環境情報があれば記入してください
      placeholder: |
        - Node.js バージョン: 
        - パッケージマネージャー: (npm/yarn/pnpm/bun)
        - その他関連情報
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: ログ
      description: 関連するログやエラーメッセージがあれば貼り付けてください
      placeholder: エラーログをここに貼り付け
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: 追加情報
      description: その他、問題に関連する情報があれば記入してください
      placeholder: その他の情報

  - type: checkboxes
    id: terms
    attributes:
      label: 確認事項
      options:
        - label: 既存のIssueを確認しました
          required: true
        - label: 最新バージョンで確認しました
          required: false
