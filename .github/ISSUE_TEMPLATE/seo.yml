name: 🔍 SEO
description: SEO関連のIssue
title: "[SEO] "
labels: ["🔍 SEO"]
body:
  - type: markdown
    attributes:
      value: |
        SEO改善の提案ありがとうございます！

  - type: input
    id: title-summary
    attributes:
      label: タイトル（簡潔な要約）
      description: この内容がIssueのタイトルに使用されます。例: 「OGP画像の追加とメタタグの改善」
      placeholder: "例: OGP画像の追加とメタタグの改善"
    validations:
      required: true

  - type: textarea
    id: target
    attributes:
      label: SEO改善の対象
      description: どの部分のSEOを改善したいか説明してください
      placeholder: "例: メタタグ、構造化データ、サイトマップ、OGP、パンくずリストなど"
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: 現在の状況
      description: 現在のSEOの状況を説明してください
      placeholder: "例: メタディスクリプションが設定されていない、OGP画像が不足しているなど"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 改善提案
      description: どのようにSEOを改善したいか説明してください
      placeholder: 具体的な改善案を記入してください
    validations:
      required: true

  - type: textarea
    id: metrics
    attributes:
      label: 期待される効果
      description: 改善によって期待されるSEO効果を説明してください
      placeholder: "例: 検索順位の向上、クリック率の改善、インデックス数の増加など"
    validations:
      required: false

  - type: textarea
    id: tools
    attributes:
      label: 使用ツール・参考資料
      description: SEOの確認に使用したツールや参考資料があれば記入してください
      placeholder: "例: Google Search Console、Lighthouse、PageSpeed Insightsなど"
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: 確認事項
      options:
        - label: 既存のIssueを確認しました
          required: true
        - label: この改善を実装する意思があります（PRを提出する予定）
          required: false
