name: 👍 Good First Issue
description: 初めてコントリビュートするのに向いているIssue
title: "[Good First Issue] "
labels: ["👍 Good First Issue"]
body:
  - type: markdown
    attributes:
      value: |
        初めてのコントリビュート、ありがとうございます！このIssueは初心者向けに設計されています。

  - type: input
    id: title-summary
    attributes:
      label: タイトル（簡潔な要約）
      description: "この内容がIssueのタイトルに使用されます。例: 「READMEにセットアップ手順を追加」"
      placeholder: "例: READMEにセットアップ手順を追加"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Issueの説明
      description: このIssueで何を実装・修正するか説明してください
      placeholder: 具体的な内容を記入してください
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 実装手順（参考）
      description: 実装の手順があれば記入してください（必須ではありません）
      placeholder: |
        例:
        1. XXXファイルを確認
        2. YYY関数を追加
        3. テストを実行
    validations:
      required: false

  - type: textarea
    id: resources
    attributes:
      label: 参考資料
      description: 実装に役立つ参考資料があれば記入してください
      placeholder: "例: ドキュメントのURL、関連するIssueなど"
    validations:
      required: false

  - type: textarea
    id: questions
    attributes:
      label: 質問・相談
      description: 実装中に質問があれば、このIssueで質問してください
      placeholder: 質問内容を記入してください
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: 確認事項
      options:
        - label: 既存のIssueを確認しました
          required: true
        - label: コントリビューションガイドラインを確認しました
          required: false
