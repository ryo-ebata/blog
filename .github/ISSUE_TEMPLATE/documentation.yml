name: 📚 Documentation
description: ドキュメントの改善や追加を提案する
title: "[Docs] "
labels: ["📃 ドキュメント"]
body:
  - type: markdown
    attributes:
      value: |
        ドキュメント改善の提案ありがとうございます！

  - type: input
    id: title-summary
    attributes:
      label: タイトル（簡潔な要約）
      description: "この内容がIssueのタイトルに使用されます。例: 「READMEにセットアップ手順を追加」"
      placeholder: "例: READMEにセットアップ手順を追加"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 問題点
      description: 現在のドキュメントの問題点や不足している情報を説明してください
      placeholder: "例: XXXの説明が不足している、YYYの手順がわかりにくい"
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: 改善提案
      description: どのように改善したいか説明してください
      placeholder: "例: XXXについての説明を追加、YYYの手順をより詳しく説明"
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: 該当箇所
      description: 改善したいドキュメントの場所（URLやファイルパス）
      placeholder: "例: README.md の「Getting Started」セクション"

  - type: textarea
    id: content
    attributes:
      label: 提案する内容
      description: 追加や変更したい内容を記入してください（可能であれば）
      placeholder: 追加したい内容や変更案をここに記入

  - type: dropdown
    id: type
    attributes:
      label: 改善タイプ
      description: どのような改善か選択してください
      options:
        - 新規ドキュメントの追加
        - 既存ドキュメントの修正
        - 誤字・脱字の修正
        - 翻訳の追加・改善
        - その他
      default: 0
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 追加情報
      description: その他、関連する情報があれば記入してください
      placeholder: その他の情報

  - type: checkboxes
    id: terms
    attributes:
      label: 確認事項
      options:
        - label: 既存のドキュメントを確認しました
          required: true
        - label: この改善を実装する意思があります（PRを提出する予定）
          required: false
